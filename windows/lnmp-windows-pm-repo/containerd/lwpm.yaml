  preuninstall: ""
  uninstall: '# _cleanup /soft/path'
  postuninstall: ""
  pruneuninstall: ""
  pretest: ""
  test: ""
  posttest: ""
  version: ""
  service:
  - C:\bin\containerd.exe
  - --log-level=debug
  - --config=C:\bin\containerd\ctn.toml
path:
- C:\bin
