name: etcher
description: Flash OS images to SD cards & USB drives, safely and easily.
scripts:
  platform-reqs: if($env:lwpm_os -eq 'linux'){echo $false}
  install: |
    _unzip $filename $unzipDesc
    # Start-Process -FilePath $filename -wait
url: https://github.com/balena-io/etcher/releases/download/v${VERSION}/balenaEtcher-$(if($env:lwpm_os -eq 'windows'){echo win32-x64-${VERSION}.zip}else{echo darwin-x64-${VERSION}.zip})
url-mirror: https://${env:GITHUB_MIRROR}/balena-io/etcher/releases/download/v${VERSION}/balenaEtcher-$(if($env:lwpm_os -eq 'windows'){echo win32-x64-${VERSION}.zip}else{echo darwin-x64-${VERSION}.zip})
version: 2.1.2
github: balena-io/etcher
