name: LWPM Dist File

on:
  push:
    branches:
      - "24.11"
  workflow_dispatch:

jobs:
  lwpm-dist-file:
    name: lwpm-dist-file
    runs-on: ${{ matrix.os }}-latest
    if: |
      contains( github.event.head_commit.message, '[k8s]')
      || github.event_name == 'workflow_dispatch'
    env:
      LWPM_DOCKER_USERNAME_: khs1994
      LWPM_DOCKER_PASSWORD_: ${{secrets.DOCKER_PASSWORD}}
      LWPM_DOCKER_REGISTRY_: registry-1.docker.io
      CODING_DOCKER_REGISTRY: docker.cnb.cool
      CODING_DOCKER_USERNAME: cnb
      CODING_DOCKER_PASSWORD: ${{secrets.CODING_DOCKER_PASSWORD}}
      GHCRIO_DOCKER_REGISTRY: ghcr.io
      GHCRIO_DOCKER_USERNAME: khs1994
      GHCRIO_DOCKER_PASSWORD: ${{secrets.GHCR_IO_TOKEN}}
    strategy:
      matrix:
        os: ["windows","ubuntu"]
      fail-fast: true
    steps:
      - uses: actions/checkout@v3
        with:
          repository: khs1994-docker/lnmp
          fetch-depth: 1
          # ref: "24.11"
          path: lnmp
      - name: handle-conmon
        shell: pwsh
        if: matrix.os == 'ubuntu' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 2.1.13
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist conmon@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push conmon@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/conmon@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/conmon@${env:VERSION}
      - name: handle-containerd
        shell: pwsh
        if: matrix.os == 'ubuntu' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 2.1.4
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist containerd@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push containerd@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/containerd@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/containerd@${env:VERSION}
      - name: handle-crictl
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.34.0
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist crictl@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push crictl@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/crictl@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/crictl@${env:VERSION}
      - name: handle-runc
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.3.0
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist runc@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push runc@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/runc@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/runc@${env:VERSION}
      - name: handle-crun
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.23.1
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist crun@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push crun@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/crun@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/crun@${env:VERSION}
      - name: handle-runsc
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: nightly
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist runsc@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push runsc@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/runsc@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/runsc@${env:VERSION}
      - name: handle-cni
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.7.1
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist cni@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push cni@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/cni@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/cni@${env:VERSION}
      - name: handle-cri-o
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.34.0
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist cri-o@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push cri-o@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/cri-o@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/cri-o@${env:VERSION}
      - name: handle-istio
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.27.0
          PKG_NAME: istio
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist ${ENV:PKG_NAME}@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push ${ENV:PKG_NAME}@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/${ENV:PKG_NAME}@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:GHCRIO_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:GHCRIO_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:GHCRIO_DOCKER_REGISTRY
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/${ENV:PKG_NAME}@${env:VERSION}
      - name: handle-compose
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[compose]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.25.5
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

