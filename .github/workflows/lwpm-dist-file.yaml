name: LWPM Dist File

on:
  push:
    branches:
      - "23.11"
  workflow_dispatch:

jobs:
  lwpm-dist-file:
    name: lwpm-dist-file
    runs-on: ${{ matrix.os }}-latest
    if: |
      contains( github.event.head_commit.message, '[lwpm dist]')
      || github.event_name == 'workflow_dispatch'
    env:
      LWPM_DOCKER_USERNAME_: khs1994
      LWPM_DOCKER_PASSWORD_: ${{secrets.DOCKER_PASSWORD}}
      LWPM_DOCKER_REGISTRY_: registry-1.docker.io
      CODING_DOCKER_REGISTRY: docker.cnb.cool
      CODING_DOCKER_USERNAME: cnb
      CODING_DOCKER_PASSWORD: ${{secrets.CODING_DOCKER_PASSWORD}}
    strategy:
      matrix:
        os: ["windows","ubuntu"]
      fail-fast: true
    steps:
      - uses: actions/checkout@v3
        with:
          repository: khs1994-docker/lnmp
          fetch-depth: 1
          # ref: "23.11"
          path: lnmp
      - name: handle-conmon
        shell: pwsh
        if: matrix.os == 'ubuntu' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 2.1.3
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist conmon@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push conmon@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/conmon@${env:VERSION}
      - name: handle-containerd
        shell: pwsh
        if: matrix.os == 'ubuntu' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 2.0.0
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist containerd@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push containerd@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/containerd@${env:VERSION}
      - name: handle-crictl
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.32.0
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist crictl@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push crictl@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/crictl@${env:VERSION}
      - name: handle-etcd
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          VERSION: 3.5.21
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist etcd@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push etcd@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/etcd@${env:VERSION}
      - name: handle-helm
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          VERSION: 3.7.0
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist helm@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push helm@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/helm@${env:VERSION}
      - name: handle-runc
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.1.0
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist runc@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push runc@${env:VERSION}

          $env:LWPM_DOCKER_USERNAME=$env:CODING_DOCKER_USERNAME
          $env:LWPM_DOCKER_PASSWORD=$env:CODING_DOCKER_PASSWORD
          $env:LWPM_DOCKER_REGISTRY=$env:CODING_DOCKER_REGISTRY
          $NS="khs1994-docker/lwpm"
          ./lnmp/windows/lnmp-windows-pm.ps1 push $NS/runc@${env:VERSION}
      - name: handle-runsc
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[k8s]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: nightly
        run: |
          $env:LWPM_DOCKER_USERNAME=$env:LWPM_DOCKER_USERNAME_
          $env:LWPM_DOCKER_PASSWORD=$env:LWPM_DOCKER_PASSWORD_
          $env:LWPM_DOCKER_REGISTRY=$env:LWPM_DOCKER_REGISTRY_

          ./lnmp/windows/lnmp-windows-pm.ps1 dist runsc@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push runsc@${env:VERSION}

      - name: handle-compose
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[compose]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 1.25.5
        run: |
          ./lnmp/windows/lnmp-windows-pm.ps1 dist compose@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push compose@${env:VERSION}

      - name: handle-jx
        shell: pwsh
        if: matrix.os == 'windows' &&
            ( contains( github.event.head_commit.message, '[jx]') || github.event_name == 'workflow_dispatch')
        env:
          VERSION: 2.1.33
        run: |
          ./lnmp/windows/lnmp-windows-pm.ps1 dist jx@${env:VERSION}
          ./lnmp/windows/lnmp-windows-pm.ps1 push jx@${env:VERSION}
